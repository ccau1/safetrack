services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safetrack
      POSTGRES_USER: safetrack
      POSTGRES_PASSWORD: safetrack
    volumes:
      - ./__postgres_data__:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetrack -d safetrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "8085:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: safetrack
      DB_USER: safetrack
      DB_PASSWORD: safetrack
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production-now-immediately}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      # Email / Invitation config (optional — leave blank to log invites to console)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3010}
      INVITE_BASE_URL: ${INVITE_BASE_URL:-}
      # Twilio config (optional — leave blank to log SMS/Voice/WhatsApp to console)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_WHATSAPP_SANDBOX_ENABLED: ${TWILIO_WHATSAPP_SANDBOX_ENABLED:-false}
      TWILIO_WHATSAPP_SANDBOX_NUMBER: ${TWILIO_WHATSAPP_SANDBOX_NUMBER:-}
      TWILIO_WHATSAPP_PHONE_NUMBER: ${TWILIO_WHATSAPP_PHONE_NUMBER:-}
      APP_TWILIO_VOICE_CALLBACK_URL: ${APP_TWILIO_VOICE_CALLBACK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  notification-service:
    build:
      context: .
      dockerfile: packages/notification-service/Dockerfile
    ports:
      - "8086:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production-now-immediately}
    restart: unless-stopped

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    ports:
      - "3010:80"
    depends_on:
      server:
        condition: service_healthy
