spring:
  application:
    name: safetrack-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safetrack}
    username: ${DB_USER:safetrack}
    password: ${DB_PASSWORD:safetrack}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-that-is-long-enough-for-hs256-algorithm-use}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3010/auth/callback}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  invitation:
    expiry-hours: 24
    base-url: ${INVITE_BASE_URL:${WEB_BASE_URL:http://localhost:3010}}

  alert:
    reply-phone-number: ${TWILIO_PHONE_NUMBER:}
    voice-script-templates:
      default: "This is a SafeTrack emergency alert. {{message}}. Press 1 if you are safe. Press 2 if you need help. Press 3 if you are on your way."
      short: "SafeTrack alert: {{message}}. Press 1 for safe, 2 for help, 3 for en route."
      urgent: "Urgent SafeTrack alert. {{message}}. Please press 1 if you are safe, 2 if you need immediate help, or 3 if you are on your way."
    whatsapp-message-templates:
      default: "🚨 SafeTrack Alert: {{message}}\n\nReply with a number:\n1️⃣ = SAFE\n2️⃣ = NEEDS HELP\n3️⃣ = EN ROUTE"
      minimal: "SafeTrack: {{message}}. Reply 1=SAFE 2=HELP 3=EN_ROUTE"
      emergency_contact: "[EMERGENCY] SafeTrack alert regarding {{message}}. Please reply 1=SAFE 2=HELP."

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}
  whatsapp-sandbox-enabled: ${TWILIO_WHATSAPP_SANDBOX_ENABLED:false}
  whatsapp-sandbox-number: ${TWILIO_WHATSAPP_SANDBOX_NUMBER:+14155238886}
  whatsapp-phone-number: ${TWILIO_WHATSAPP_PHONE_NUMBER:}
  voice-callback-url: ${APP_TWILIO_VOICE_CALLBACK_URL:}

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.safetrack: DEBUG
