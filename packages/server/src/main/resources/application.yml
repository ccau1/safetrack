spring:
  application:
    name: safetrack-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safetrack}
    username: ${DB_USER:safetrack}
    password: ${DB_PASSWORD:safetrack}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-that-is-long-enough-for-hs256-algorithm-use}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3010/auth/callback}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  invitation:
    expiry-hours: 24
    base-url: ${INVITE_BASE_URL:http://localhost:3010}

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.safetrack: DEBUG
