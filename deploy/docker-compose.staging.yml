# =============================================================================
# SafeTrack Staging
# =============================================================================
version: "3.9"

services:
  app:
    image: ${APP_IMAGE}
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.safetrack-staging.rule=Host(`${DOMAIN_STAGING}`)"
      - "traefik.http.routers.safetrack-staging.entrypoints=websecure"
      - "traefik.http.routers.safetrack-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.safetrack-staging.loadbalancer.server.port=80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - staging
    restart: unless-stopped

networks:
  staging:
    external: true
