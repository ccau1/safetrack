# =============================================================================
# SafeTrack Staging
# =============================================================================
version: "3.9"

services:
  app:
    image: ${APP_IMAGE}
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-staging.rule=Host(`${DOMAIN_STAGING}`)"
      - "traefik.http.routers.app-staging.entrypoints=websecure"
      - "traefik.http.routers.app-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.app-staging.loadbalancer.server.port=80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: safetrack-postgres-staging
    environment:
      POSTGRES_DB: safetrack
      POSTGRES_USER: safetrack
      POSTGRES_PASSWORD: safetrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetrack -d safetrack"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  staging:
    external: true

volumes:
  postgres_data:
