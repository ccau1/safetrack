# =============================================================================
# SafeTrack Production — nginx direct + Cloudflare Origin CA
# =============================================================================
version: "3.9"

services:
  app:
    image: ${APP_IMAGE}
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
