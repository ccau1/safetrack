services:
  safetrack:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3010}:${WEB_PORT:-80}"
      - "${API_PORT:-8085}:${API_PORT:-8080}"
    environment:
      # Port configuration
      WEB_PORT: ${WEB_PORT:-80}
      API_PORT: ${API_PORT:-8080}
      NOTIFICATION_PORT: ${NOTIFICATION_PORT:-8081}

      # Database
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-safetrack}
      DB_USER: ${DB_USER:-safetrack}
      DB_PASSWORD: ${DB_PASSWORD:-safetrack}

      # Security
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production-now-immediately}

      # OAuth2 (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}

      # SMTP / Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

      # App URLs
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3010}
      INVITE_BASE_URL: ${INVITE_BASE_URL:-}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost:3010/auth/callback}

      # Cookies
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}

      # Twilio config (optional — leave blank to log SMS/Voice/WhatsApp to console)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_WHATSAPP_SANDBOX_ENABLED: ${TWILIO_WHATSAPP_SANDBOX_ENABLED:-false}
      TWILIO_WHATSAPP_SANDBOX_NUMBER: ${TWILIO_WHATSAPP_SANDBOX_NUMBER:-}
      TWILIO_WHATSAPP_PHONE_NUMBER: ${TWILIO_WHATSAPP_PHONE_NUMBER:-}
      APP_TWILIO_VOICE_CALLBACK_URL: ${APP_TWILIO_VOICE_CALLBACK_URL:-}

      # Spring profiles (optional)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT:-8080}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-safetrack}
      POSTGRES_USER: ${DB_USER:-safetrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-safetrack}
    volumes:
      - ./__postgres_data__:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-safetrack} -d ${DB_NAME:-safetrack}"]
      interval: 5s
      timeout: 5s
      retries: 5
